[pytest]
testpaths = tests
# Doctests keep the fixture regression checks in T002's assigned support paths.
addopts = --import-mode=importlib --strict-markers --strict-config --doctest-modules --tb=no --show-capture=no
filterwarnings = error
junit_family = xunit2
markers =
    unit: isolated Python behavior without external services
    integration: real PostgreSQL or component integration
    contract: frozen API v1 shape, status, header and authorization checks
    concurrency: independent connections contending against the same case database
    privacy: contact retention, read suppression and redaction
    timezone: IANA, UTC and DST behavior
    fault: explicitly injected private fault behavior (not durability proof)
