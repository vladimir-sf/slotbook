# T009 migration CLI handoff (working directory backend/ or /app in the image):
# alembic upgrade head; alembic current
# Supply MIGRATION_DATABASE_URL privately at runtime, never as a build argument
# or a command-line URL. DATABASE_URL is reserved for the ordinary runtime role.
# Use postgresql+psycopg, PostgreSQL 16, fsync=on, synchronous_commit=on.
# A dedicated, fixed migration principal must own the database/schemas and have
# CREATEROLE plus permission to install btree_gist. Never give these powers to
# API/worker/backup logins. The CLI never provisions passwords or login accounts.
# Provision separate logins externally and grant slotbook_runtime (API/worker)
# or slotbook_backup membership; neither group can log in, create objects or
# inherit other roles. Migration credentials must not enter API/worker services.
# Future migrations MUST explicitly grant required runtime DML and allowlisted
# backup table/column reads; no future table gets either role's access by default.
# One explicit migration job runs before application services, never per replica.
# Success exits 0; configuration/preflight/SQL failures exit nonzero with a safe
# code. Online verification is mandatory; --sql and downgrade are rejected.
# No logging configuration: SQL, parameters, connection strings and DB errors
# must not be emitted. Keep raw process output in private operator evidence.
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os
