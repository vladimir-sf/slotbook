[pytest]
testpaths = contract
norecursedirs = .* backend frontend node_modules
pythonpath = .
addopts = --import-mode=importlib --strict-markers --strict-config -q --tb=no
junit_family = xunit1
junit_logging = no
junit_log_passing_tests = false
markers =
    harness: isolated guard/redaction self-tests (no application or Docker)
    schema: synthetic frozen-contract fixtures, not live API conformance
    associations(*ids): numeric task/scenario/FR/SC/RP evidence associations
