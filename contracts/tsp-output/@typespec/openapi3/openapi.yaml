                additionalProperties: false
        '503':
          description: Service unavailable.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
            X-Attempt-Expires-At:
              required: false
              description: Original E is REQUIRED when receipt is verified; omit if unknown. Never reset on retry.
              schema:
                type: string
                format: date-time
          content:
            application/json:
              schema:
                anyOf:
