                        enum:
                          - execution_unverified
                      message:
                        type: string
                        description: Safe human-readable text without contacts, tokens, original attempt values or stack traces.
                    additionalProperties: false
                  - type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        enum:
                          - service_unavailable
                      message:
                        type: string
                        description: Safe human-readable text without contacts, tokens, original attempt values or stack traces.
                    additionalProperties: false
      requestBody:
