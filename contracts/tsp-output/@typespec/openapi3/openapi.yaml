components:
  schemas:
    Activity:
      type: object
      required:
        - slug
        - title
        - durationMinutes
        - timezone
        - isActive
        - description
        - id
      properties:
        slug:
          type: string
        title:
          type: string
        durationMinutes:
          $ref: '#/components/schemas/ActivityDuration'
        timezone:
          $ref: '#/components/schemas/IanaTimezone'
        isActive:
          type: boolean
        description:
          $ref: '#/components/schemas/NormalizedActivityDescription'
        id:
          $ref: '#/components/schemas/Id'
      additionalProperties: false
    ActivityDescription:
      type: string
      description: |-
        After outer whitespace trimming: 1–2000 Unicode code points, multiline literal plain
        text. Preserve internal whitespace/line breaks; never truncate or interpret markup.
        Input is trimmed before length validation; raw surrounding whitespace is not counted.
        Runtime must count Unicode code points, not UTF-16 code units.
    ActivityDuration:
      type: integer
      format: int32
      minimum: 15
      description: Positive integer divisible by 15; enforced by both schema and server validation.
      multipleOf: 15
    ActivityWrite:
      type: object
      required:
        - slug
        - title
        - description
        - durationMinutes
        - timezone
        - isActive
      properties:
        slug:
          type: string
        title:
          type: string
        description:
          $ref: '#/components/schemas/ActivityDescription'
        durationMinutes:
          $ref: '#/components/schemas/ActivityDuration'
        timezone:
          $ref: '#/components/schemas/IanaTimezone'
        isActive:
          type: boolean
      additionalProperties: false
    AdminBooking:
      type: object
      required:
        - id
        - activityId
        - startsAt
        - endsAt
        - status
        - canceledAt
        - contact
      properties:
        id:
          $ref: '#/components/schemas/Id'
        activityId:
          $ref: '#/components/schemas/Id'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - confirmed
            - canceled
        canceledAt:
          type: string
          format: date-time
          nullable: true
        contact:
          $ref: '#/components/schemas/BookingContact'
      additionalProperties: false
      description: |-
        Protected history. Suppress contacts before serialization at/after recorded end +720h,
        or first cancellation +720h when canceled, even if automatic deletion fails. Repeated
        cancellation/config edits/retries never reset the anchor; restores may remove contacts earlier.
    AdminCredentials:
      type: object
      required:
        - email
        - password
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
      additionalProperties: false
    AdminToken:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresAt
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
            - bearer
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
      description: |-
        Opaque bearer kept only in browser memory (no browser storage/URL). Server-enforced
        fixed 60 elapsed minutes from login; active use never extends it; no refresh/renewal.
        Reload requires login. At expiry clear/lock protected state, retain only non-sensitive
        config drafts, and require credentials plus explicit resubmission of failed writes.
    AttemptContext:
      type: object
      required:
        - generation
      properties:
        generation:
          $ref: '#/components/schemas/AttemptGeneration'
      additionalProperties: false
    AttemptGeneration:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      format: uuid
      description: Public random restore epoch, a canonical lowercase UUID; not a credential.
    AttemptPending:
      type: object
      required:
        - state
        - expiresAt
      properties:
        state:
          type: string
          enum:
            - pending
        expiresAt:
          type: string
          format: date-time
      additionalProperties: false
      description: Admitted but unfinished at the verified read; no promised background worker.
    AttendeeName:
      type: string
      pattern: \S
      description: Nonblank name; preserve the exact submitted string for retry matching.
    BlockedDate:
      type: object
      required:
        - date
      properties:
        date:
          type: string
          format: date
      additionalProperties: false
      description: One activity-local date; other activities and existing bookings remain unchanged.
    BookingAttemptKey:
      type: string
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$
      description: |-
        Echo the context generation verbatim, then '.', then canonical unpadded base64url
        encoding of 32 cryptographically random bytes (43 characters). Generate before first
        submission, keep private in memory, reuse only with original details. Never put in URLs.
        The server HMAC verifier is never an accepted credential.
    BookingContact:
      type: object
      oneOf:
        - $ref: '#/components/schemas/PresentContacts'
        - $ref: '#/components/schemas/RemovedContacts'
      discriminator:
        propertyName: state
        mapping:
          present: '#/components/schemas/PresentContacts'
          removed: '#/components/schemas/RemovedContacts'
    BookingRequest:
      type: object
      required:
        - activityId
        - startsAt
        - attendeeName
        - attendeeEmail
      properties:
        activityId:
          $ref: '#/components/schemas/Id'
        startsAt:
          type: string
          format: date-time
        attendeeName:
          $ref: '#/components/schemas/AttendeeName'
        attendeeEmail:
          $ref: '#/components/schemas/Email'
      additionalProperties: false
      description: |-
        Unknown fields are rejected, including endsAt. Derive end from current activity duration.
        Match activity UUID and UTC start canonically; name/email remain exact submitted strings.
        JSON/type-invalid submissions bind a versioned raw-body digest, never stored raw bytes.
    BookingSummary:
      type: object
      required:
        - id
        - activityId
        - startsAt
        - endsAt
        - status
        - canceledAt
      properties:
        id:
          $ref: '#/components/schemas/Id'
        activityId:
          $ref: '#/components/schemas/Id'
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - confirmed
            - canceled
        canceledAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
      description: |-
        EVERY public success is contact-free, including the first confirmation. Start/end remain
        immutable after booking. canceledAt is null iff status is confirmed; otherwise it is the
        original cancellation instant. Retries return current status, never revive a canceled booking.
    Email:
      type: string
      format: email
      description: Syntactically valid email; no delivery check or additional identity normalization.
    FieldError:
      type: object
      required:
        - path
        - code
        - message
      properties:
        path:
          type: string
          description: Dotted contracted input path (array indexes allowed); unknown field names use "$".
        code:
          type: string
          enum:
            - required
            - invalid
            - unknown_field
            - overlap
            - duplicate
          description: 'Stable field reason: required, invalid, unknown_field, overlap or duplicate.'
        message:
          type: string
      additionalProperties: false
      description: Safe field guidance only; never echo submitted values or raw framework validation objects.
    HealthStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
      additionalProperties: false
    IanaTimezone:
      type: string
      description: Supported IANA timezone identifier, validated against server timezone data.
    Id:
      type: string
      format: uuid
    LocalClock:
      type: string
      pattern: ^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9](?:\.[0-9]+)?)?$
      description: |-
        ISO local clock without offset: HH:mm, optionally :ss and fractional seconds.
        Retains local-clock precision without imposing a quarter-hour/minute restriction.
        Explicit pattern avoids plainTime's emitted `format: time`, which RFC 3339 validators
        interpret as requiring a timezone even though working-window clocks have none.
    NoStore:
      type: object
    NormalizedActivityDescription:
      type: string
      description: Canonical saved/read description, after the documented input trimming step.
      minLength: 1
      maxLength: 2000
    PresentContacts:
      type: object
      required:
        - state
        - attendeeName
        - attendeeEmail
      properties:
        state:
          type: string
          enum:
            - present
        attendeeName:
          $ref: '#/components/schemas/AttendeeName'
        attendeeEmail:
          $ref: '#/components/schemas/Email'
      additionalProperties: false
    ReadyStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ready
      additionalProperties: false
    RemovedContacts:
      type: object
      required:
        - state
      properties:
        state:
          type: string
          enum:
            - removed
      additionalProperties: false
      description: No attendee fields or fake identities; also used after contact-free restore.
    Slot:
      type: object
      required:
        - startsAt
        - endsAt
      properties:
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
      additionalProperties: false
      description: Contact-free UTC interval; display labels/offsets are derived in the chosen IANA zone.
    WeeklyWindow:
      type: object
      required:
        - isoWeekday
        - localStart
        - localEnd
      properties:
        isoWeekday:
          type: integer
          format: int32
          minimum: 1
          maximum: 7
        localStart:
          $ref: '#/components/schemas/LocalClock'
        localEnd:
          $ref: '#/components/schemas/LocalClock'
      additionalProperties: false
      description: |-
        Same activity/weekday: end > start within one local day, no duplicate/overlap/overnight
        windows. Touching is allowed but never merged. Times retain offset-free local-clock precision and
        need not align to quarter hours. Invalid replacement changes nothing.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
servers:
  - url: http://localhost:8000
    description: Local API
    variables: {}
